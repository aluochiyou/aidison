name: aidison

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://aidison:${POSTGRES_PASSWORD:-aidison_dev}@postgres:5432/aidison
  AIDISON_ARTIFACT_ROOT: /data/artifacts
  AIDISON_MODEL_PROVIDER: ${AIDISON_MODEL_PROVIDER:-bailian}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-advanced}
  TAVILY_SEARCH_TIMEOUT_SECONDS: ${TAVILY_SEARCH_TIMEOUT_SECONDS:-10}

x-backend-service: &backend-service
  image: aidison-backend:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: *backend-environment
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aidison
      POSTGRES_USER: aidison
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidison_dev}
    ports:
      - "${AIDISON_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidison -d aidison"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    command: ["uvicorn", "aidison.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${AIDISON_API_PORT:-8000}:8000"
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *backend-service
    command: ["python", "-m", "aidison.worker"]
    environment:
      <<: *backend-environment
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
      GITHUB_MCP_BINARY_PATH: /server/github-mcp-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "python", "-m", "aidison.worker", "--check"]
      interval: 15s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        AIDISON_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AIDISON_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts:
