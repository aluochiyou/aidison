# Non-secret application defaults. Keep API keys and database credentials in .env.

model:
  provider: bailian
  dashscope_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  dashscope_model: qwen-plus
  openai_model: gpt-5.2

research:
  mcp_url: https://mcp.tavily.com/mcp
  search_depth: advanced
  timeout_seconds: 10

database:
  echo_sql: false

runtime:
  artifact_root: artifacts/data
  concurrency: 3
  lease_seconds: 60
  poll_seconds: 0.5
  durable_recheck_seconds: 30

shopping:
  effect_approval_ttl_seconds: 900
  # Runtime shopping provider selection (nonsecret): "none" (no provider) or
  # "taobao" (search-only).  Provider secrets come from the environment.
  provider: none

taobao:
  # Non-secret search-only defaults.  Secrets come from TAOBAO_APP_KEY and
  # TAOBAO_APP_SECRET in the environment only.  Taobao is search-only: it
  # never creates carts, orders, payments, or product-redirect handoffs.
  adzone_id: ""
  search_timeout_seconds: 5.0
  max_search_results: 20
